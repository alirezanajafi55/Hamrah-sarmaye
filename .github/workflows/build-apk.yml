    /** Starts/rebuilds the independent global feeds when maker registry mappings become available. */
    private fun startGlobalFeedScheduler() {
        val configs = assets.mapNotNull { item ->
            GlobalAssetResolver.load(prefs, item.assetType, item.name)?.let(GlobalAssetResolver::toFeedConfig)
        }.distinctBy { it.assetKey }
        val signature = configs.map { "${it.assetKey}:${it.endpoint}" }.sorted().joinToString("|")
        if (signature == globalFeedSignature) return
        globalFeedScheduler?.stop()
        globalFeedScheduler = null
        globalFeedSignature = signature
        if (configs.isEmpty()) return
        globalFeedScheduler = MarketRefreshScheduler(intervalMs = 5 * 60_000L) { _, result ->
            if (result is FeedResult.Success && MarketDataPolicy.assess(result.quote).usableForAnalysis) {
                val q = result.quote
                runOnUiThread {
                    assets.filter { item ->
                        GlobalAssetResolver.identify(item.assetType, item.name)?.key == q.assetKey
                    }.forEach { item ->
                        item.globalPrice = q.value
                        item.globalCurrency = q.currency
                        item.globalUnit = q.unit
                        item.globalSource = q.provider
                        item.globalUpdatedAt = q.observedAtEpochMs.toString()
                    }
                    saveAssets()
                    if (!isFinishing) render()
                }
            }
        }.also { it.start(configs) }
    }

    override fun onDestroy() {
        globalFeedScheduler?.stop()
        globalFeedScheduler = null

        // Release the security dialog before this Activity's window is destroyed.
        // This prevents a Dialog window from being retained by a dead Activity.
        authDialog?.let { dialog ->
            dialog.setOnDismissListener(null)
            if (dialog.isShowing) dialog.dismiss()
        }
        authDialog = null
        authDialogShowing = false

        super.onDestroy()
    }

    // Exact conversion factor for 1 troy ounce of 24k gold to grams of 18k gold.
    // 31.1034768 g / 0.75 = 41.4713024; retained at the agreed 4-decimal precision.
    private companion object { const val GOLD_18_FACTOR = 41.4713 }

    private fun isGoldAsset(item: AssetItem): Boolean {
        val name = item.name.lowercase(Locale.ROOT)
        return item.assetType == "طلا و فلزات" && (name.contains("طلا") || name.contains("gold"))
    }

    private fun theoreticalGold18Price(item: AssetItem): Double? {
        val unit = item.globalUnit.lowercase(Locale.ROOT)
        val isTroyOunce = unit.contains("اونس") || unit.contains("ounce")
        if (item.globalPrice <= 0.0 || item.globalCurrency.uppercase(Locale.ROOT) != "USD" ||
            !isTroyOunce || item.usdToLocalRate <= 0.0 || item.usdToLocalCountry != selectedCountry ||
            item.positionCountry != selectedCountry) return null
        val calculated = (item.globalPrice * item.usdToLocalRate) / GOLD_18_FACTOR
        return calculated.takeIf { it.isFinite() && it > 0.0 }
    }

    // Bubble comparison is only valid when the domestic quote is explicitly per gram of 18k gold.
    private fun isGold18GramAsset(item: AssetItem): Boolean {
        val name = item.name.lowercase(Locale.ROOT)
        val has18K = name.contains("۱۸") || name.contains("18")
        val hasGram = name.contains("گرم") || name.contains("gram") || name.endsWith(" g")
        return isGoldAsset(item) && has18K && hasGram
    }

    private fun checkForAppUpdate() {
        Toast.makeText(this, "در حال بررسی نسخه جدید...", Toast.LENGTH_SHORT).show()
        UpdateSupport.check(this) { manifest, error ->
            if (isFinishing) return@check
            if (error != null || manifest == null) {
                AlertDialog.Builder(this).setTitle("بررسی به‌روزرسانی")
                    .setMessage(error ?: "اطلاعات نسخه دریافت نشد.")
                    .setPositiveButton("باشه", null).show()
                return@check
            }
            val remoteCode = manifest.optInt("versionCode", -1)
            val remoteName = manifest.optString("versionName", "")
            if (remoteCode <= BuildConfig.VERSION_CODE) {
                AlertDialog.Builder(this).setTitle("به‌روزرسانی")
                    .setMessage("برنامه شما به‌روز است. نسخه فعلی: ${BuildConfig.VERSION_NAME}")
                    .setPositiveButton("باشه", null).show()
                return@check
            }
            val notes = manifest.optString("releaseNotes", "توضیحات تغییرات ثبت نشده است.")
            AlertDialog.Builder(this).setTitle("نسخه جدید $remoteName")
                .setMessage("نسخه فعلی: ${BuildConfig.VERSION_NAME}\nنسخه جدید: $remoteName\n\nتغییرات:\n$notes\n\nپیش از دریافت، از اطلاعات دارایی‌ها نسخه پشتیبان داخلی تهیه می‌شود. نصب نسخه جدید فقط با امضای معتبر همان سازنده امکان‌پذیر است.")
                .setPositiveButton("دریافت نسخه جدید") { _, _ ->
                    saveAssets()
                    prefs.edit()
                        .putString("pre_update_backup_assets", prefs.getString("assets", "[]"))
                        .putString("pre_update_backup_country", selectedCountry)
                        .putLong("pre_update_backup_time", System.currentTimeMillis())
                        .apply()
                    UpdateSupport.downloadAndInstall(this, manifest.getString("apkUrl"), remoteName)
                }
                .setNegativeButton("بعداً", null).show()
        }
    }

