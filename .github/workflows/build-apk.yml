
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'hamrah_sarmaye_v0.4.2_logo_sdk_fixed_source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "::error::Android command-line tools directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

          echo "Android SDK installation verified."

      - name: Extract source and detect Gradle
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="hamrah_sarmaye_v0.4.2_logo_sdk_fixed_source.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP"
            echo "ZIP files available in repository:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          mkdir -p source
          unzip -q "$SOURCE_ZIP" -d source

          SETTINGS_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found in source ZIP"
            find source -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

          export PROJECT_DIR

          python3 - <<'PY'
          import os, re, glob, sys

          root = os.environ["PROJECT_DIR"]
          files = []

          for pattern in ("**/*.gradle", "**/*.gradle.kts", "**/*.toml"):
              files += glob.glob(os.path.join(root, pattern), recursive=True)

          version = None

          patterns = [
              r'\bagp\s*=\s*["\'](\d+\.\d+(?:\.\d+)?)["\']',
              r'\b(?:androidGradlePlugin|agpVersion)\s*=\s*["\'](\d+\.\d+(?:\.\d+)?)["\']',
              r'com\.android\.(?:application|library)[\s\S]{0,150}?version\s*["\'](\d+\.\d+(?:\.\d+)?)["\']'
          ]

          for path in files:
              try:
                  content = open(path, encoding="utf-8").read()
              except Exception:
                  continue

              for pattern in patterns:
                  match = re.search(pattern, content)
                  if match:
                      version = match.group(1)
                      break

              if version:
                  break

          print("Detected Android Gradle Plugin:", version or "NOT FOUND")

          if not version:
              sys.exit("Could not detect Android Gradle Plugin version")

          major_minor = ".".join(version.split(".")[:2])

          versions = {
              "8.0": "8.0",
              "8.1": "8.0",
              "8.2": "8.2",
              "8.3": "8.4",
              "8.4": "8.6",
              "8.5": "8.7",
              "8.6": "8.7",
              "8.7": "8.9",
              "8.8": "8.10.2",
              "8.9": "8.11.1",
              "8.10": "8.11.1",
              "8.11": "8.13",
              "8.12": "8.13",
              "8.13": "8.13"
          }

          gradle = versions.get(major_minor)

          if not gradle:
              sys.exit("No configured Gradle version for AGP " + version)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("gradle_version=" + gradle + "\n")

          print("Selected Gradle version:", gradle)
          PY

          grep -q 'versionCode = 18' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "0.4.2-dev"' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Apply the two approved logos
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/logo-venv"
          "$RUNNER_TEMP/logo-venv/bin/pip" install --quiet Pillow

          "$RUNNER_TEMP/logo-venv/bin/python" - <<'PYLOGO'
          from pathlib import Path
          from PIL import Image
          import os
          import xml.etree.ElementTree as ET

          project = Path(os.environ["PROJECT_DIR"])
          repo = Path(os.environ["GITHUB_WORKSPACE"])

          launcher_file = repo / "Polish_۲۰۲۶۱۱۲۶_۱۳۲۳۴۹۳۵۷.jpg"
          inapp_file = repo / "Logopit_1795673552004.jpg"

          if not launcher_file.is_file():
              raise SystemExit("Launcher logo file is missing: " + str(launcher_file))

          if not inapp_file.is_file():
              raise SystemExit("In-app logo file is missing: " + str(inapp_file))

          res = project / "app/src/main/res"

          # In-app logo
          inapp_target = res / "drawable-nodpi/app_logo.jpg"
          inapp_target.parent.mkdir(parents=True, exist_ok=True)

          with Image.open(inapp_file) as im:
              im.convert("RGB").save(
                  inapp_target,
                  "JPEG",
                  quality=96,
                  optimize=True
              )

          # Launcher icon
          with Image.open(launcher_file) as im:
              original = im.convert("RGBA")

          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))

          art = original.copy()
          art.thumbnail((288, 288), Image.Resampling.LANCZOS)

          fg.alpha_composite(
              art,
              ((432 - art.width) // 2, (432 - art.height) // 2)
          )

          draw = res / "drawable-nodpi"
          draw.mkdir(parents=True, exist_ok=True)
          fg.save(draw / "ic_launcher_foreground.png", optimize=True)

          # Legacy launcher icons
          for density, size in {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }.items():

              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              canvas = Image.new(
                  "RGBA",
                  (size, size),
                  (16, 16, 16, 255)
              )

              icon = original.copy()
              icon.thumbnail(
                  (int(size * 0.78), int(size * 0.78)),
                  Image.Resampling.LANCZOS
              )

              canvas.alpha_composite(
                  icon,
                  ((size - icon.width) // 2, (size - icon.height) // 2)
              )

              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)

          # Adaptive launcher icons
          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)

          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''

          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (anydpi / name).write_text(xml, encoding="utf-8")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)

          (values / "ic_launcher_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#101010</color>
          </resources>
          ''',
              encoding="utf-8"
          )

          # Update Android manifest
          manifest = project / "app/src/main/AndroidManifest.xml"

          tree = ET.parse(manifest)
          app = tree.getroot().find("application")

          if app is None:
              raise SystemExit("Manifest application element missing")

          ns = "{http://schemas.android.com/apk/res/android}"

          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Launcher logo applied:", launcher_file.name)
          print("In-app logo applied:", inapp_file.name)
          PYLOGO

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/hamrah-jvm-target.init.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin") &&
                      task.hasProperty("kotlinOptions")) {
                      task.kotlinOptions.jvmTarget = "1.8"
                  }
              }
          }
          EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'applicationId = "com.hamrahsarmaye.app"' "$PROJECT_DIR/app/build.gradle.kts"

          echo "Android project and application ID verified."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GLOBAL_ASSET_REGISTRY_URL: ${{ vars.GLOBAL_ASSET_REGISTRY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            --init-script "$RUNNER_TEMP/hamrah-jvm-target.init.gradle" \
            -PGLOBAL_ASSET_REGISTRY_URL="${GLOBAL_ASSET_REGISTRY_URL:-}" \
            clean assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK_PATH"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose "$APK_PATH"

          "$AAPT" dump badging "$APK_PATH" > "$RUNNER_TEMP/hamrah-debug-badging.txt"

          grep -q "package: name='com.hamrahsarmaye.app'" "$RUNNER_TEMP/hamrah-debug-badging.txt"
          grep -q "launchable-activity:" "$RUNNER_TEMP/hamrah-debug-badging.txt"

          ls -lh "$APK_PATH"

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then

            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hamrah-release-2026.jks"

            test -s "$RUNNER_TEMP/hamrah-release-2026.jks"

            keytool -list \
              -keystore "$RUNNER_TEMP/hamrah-release-2026.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null

            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/hamrah-release-2026.jks" >> "$GITHUB_ENV"

          else

            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release secrets are not configured; debug APK only."

          fi

      - name: Build and verify signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ env.ANDROID_RELEASE_STORE_FILE }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GLOBAL_ASSET_REGISTRY_URL: ${{ vars.GLOBAL_ASSET_REGISTRY_URL }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            --init-script "$RUNNER_TEMP/hamrah-jvm-target.init.gradle" \
            -PGLOBAL_ASSET_REGISTRY_URL="${GLOBAL_ASSET_REGISTRY_URL:-}" \
            assembleRelease

          APK_PATH="$PWD/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK_PATH"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK_PATH" \
            > "$RUNNER_TEMP/hamrah-release-cert.txt"

          grep -Eiq \
            '23b6ee0fa52b826ad83af925277ec1b9f9e48855ca2735a6d313976c2acbf082' \
            "$RUNNER_TEMP/hamrah-release-cert.txt"

          echo "Release certificate fingerprint verified."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-sarmaye-v0.4.2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-sarmaye-v0.4.2-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
