    private fun estimatedValue(item: AssetItem): Double {
        val base = item.valuationBase
        val adjustment = 1.0 + (item.valuationAdjustmentPercent / 100.0)
        if (base <= 0.0 || adjustment <= 0.0) return 0.0
        return if (item.assetType == "خانه / ملک") {
            if (item.valuationArea <= 0.0) 0.0 else item.valuationArea * base * adjustment
        } else if (item.assetType == "خودرو") {
            base * adjustment
        } else 0.0
    }

    private fun valuationDialog(index: Int) {
        val item = assets[index]
        val details = EditText(this).apply {
            hint = if (item.assetType == "خانه / ملک") "شهر، محله، سن بنا، طبقه، امکانات و وضعیت سند" else "برند، مدل، تیپ، سال ساخت، کارکرد و وضعیت بدنه/فنی"
            setText(item.valuationDetails)
        }
        val base = EditText(this).apply {
            hint = if (item.assetType == "خانه / ملک") "قیمت هر متر مربع ملک مشابه به ${currencyLabel(selectedCountry)}" else "قیمت نمونه مشابه خودرو به ${currencyLabel(selectedCountry)}"
            inputType = 8194
            if (item.valuationBase > 0) setText(item.valuationBase.toString())
        }
        val area = EditText(this).apply {
            hint = "متراژ ملک به متر مربع"
            inputType = 8194
            if (item.valuationArea > 0) setText(item.valuationArea.toString())
            visibility = if (item.assetType == "خانه / ملک") View.VISIBLE else View.GONE
        }
        val adjustment = EditText(this).apply {
            hint = "درصد تعدیل نسبت به نمونه مشابه (مثلاً ۵ یا ۵- برای منفی)"
            inputType = 12290
            if (item.valuationAdjustmentPercent != 0.0) setText(item.valuationAdjustmentPercent.toString())
        }
        AlertDialog.Builder(this).setTitle("ارزش‌گذاری تخمینی ${item.name}")
            .setView(dialogBox(details, base, area, adjustment))
            .setPositiveButton("محاسبه و ذخیره") { _, _ ->
                val b = parseNumber(base.text.toString())
                val a = if (item.assetType == "خانه / ملک") parseNumber(area.text.toString()) else 1.0
                val adj = if (adjustment.text.isNullOrBlank()) 0.0 else parseNumber(adjustment.text.toString())
                if (b == null || b <= 0.0 || a == null || a <= 0.0 || adj == null || adj <= -100.0) {
                    toast("قیمت پایه، متراژ و درصد تعدیل را درست وارد کنید.")
                    return@setPositiveButton
                }
                item.valuationBase = b
                item.valuationArea = a
                item.valuationAdjustmentPercent = adj
                item.valuationDetails = details.text.toString().trim()
                item.positionCountry = selectedCountry
                saveAssets(); render()
            }.setNegativeButton("لغو", null).show()
    }

    private fun tradeDialog(index: Int, isBuy: Boolean) {
        val selectedItem = assets[index]
        if ((selectedItem.amount > 0.0 || selectedItem.realizedPnl != 0.0) && selectedItem.positionCountry != selectedCountry) {
            toast("معاملات این دارایی در بازار ${selectedItem.positionCountry} ثبت شده است. برای جلوگیری از مخلوط‌شدن ارزها، کشور را به همان بازار برگردانید.")
            return
        }
        val qty = EditText(this).apply { hint = "مقدار"; inputType = 8194 }
        val price = EditText(this).apply { hint = "قیمت هر واحد به ${localCurrencyLabel()}"; inputType = 8194 }
        val box = dialogBox(qty, price)
        AlertDialog.Builder(this).setTitle(if (isBuy) "ثبت خرید ${assets[index].name}" else "ثبت فروش ${assets[index].name}")
            .setView(box).setPositiveButton("ثبت") { _, _ ->
                val q = parseNumber(qty.text.toString())
                val p = parseNumber(price.text.toString())
                if (q == null || p == null || q <= 0.0 || p <= 0.0) {
                    toast("مقدار و قیمت باید عددی و بزرگ‌تر از صفر باشند."); return@setPositiveButton
                }
                val item = assets[index]
                if (!isBuy && q > item.amount) { toast("مقدار فروش از موجودی بیشتر است."); return@setPositiveButton }
                tradeHistory.add(TradeRecord(item.name, if (isBuy) "BUY" else "SELL", q, p, localCurrencyLabel()))
                if (isBuy) {
                    if (item.amount == 0.0 && item.realizedPnl == 0.0) item.positionCountry = selectedCountry
                    val newAmount = item.amount + q
                    item.averageBuyPrice = ((item.amount * item.averageBuyPrice) + (q * p)) / newAmount
                    item.amount = newAmount
                } else {
                    item.realizedPnl += q * (p - item.averageBuyPrice)
                    item.amount -= q
                    if (item.amount < 0.000000001) item.amount = 0.0
                }
                // Trade execution price must not overwrite the independent market quote.
                saveAssets(); render()
            }.setNegativeButton("لغو", null).show()
    }

    private fun priceDialog(index: Int) {
        val selectedItem = assets[index]
        if ((selectedItem.amount > 0.0 || selectedItem.realizedPnl != 0.0) && selectedItem.positionCountry != selectedCountry) {
            toast("این دارایی در بازار ${selectedItem.positionCountry} نگهداری/معامله شده است. برای ثبت قیمت معتبر، همان کشور را انتخاب کنید.")
            return
        }
        val price = EditText(this).apply { hint = "قیمت فعلی هر واحد به ${localCurrencyLabel()}"; inputType = 8194 }
        AlertDialog.Builder(this).setTitle("به‌روزرسانی قیمت ${assets[index].name}")
            .setView(dialogBox(price)).setPositiveButton("ثبت قیمت") { _, _ ->
                val p = parseNumber(price.text.toString())
                if (p == null || p <= 0.0) toast("قیمت باید عددی و بزرگ‌تر از صفر باشد.")
                else {
                    assets[index].currentPrice = p
                    assets[index].internalSource = "ثبت دستی کاربر"
                    assets[index].internalCountry = selectedCountry
                    assets[index].internalUpdatedAt = java.text.SimpleDateFormat("yyyy/MM/dd HH:mm", Locale("fa", "IR")).format(java.util.Date())
                    saveAssets(); render()
                }
            }.setNegativeButton("لغو", null).show()
    }


    private fun countryDialog() {
        AlertDialog.Builder(this)
            .setTitle("کشور بازار داخلی را انتخاب کنید")
            .setSingleChoiceItems(supportedCountries, supportedCountries.indexOf(selectedCountry).coerceAtLeast(0)) { dialog, which ->
                selectedCountry = supportedCountries[which]
                prefs.edit().putString("selected_country", selectedCountry).apply()
                dialog.dismiss()
                render()
                toast("کشور انتخاب شد. قیمت‌های کشور قبلی برای این بازار استفاده نمی‌شوند؛ منبع خودکار هنوز باید متصل شود.")
            }
            .setNegativeButton("لغو", null)
            .show()
    }

    private fun globalPriceDialog(index: Int) {
        val value = EditText(this).apply { hint = "مقدار قیمت جهانی"; inputType = 8194 }
        val currency = EditText(this).apply { hint = "ارز (مثلاً USD)"; setText("USD") }
        val unit = EditText(this).apply { hint = "واحد (مثلاً هر اونس تروا)"; setText("هر اونس تروا") }
        val source = EditText(this).apply { hint = "نام مرجع جهانی" }
        AlertDialog.Builder(this).setTitle("ثبت مرجع جهانی ${assets[index].name}")
            .setView(dialogBox(value, currency, unit, source))
            .setPositiveButton("ثبت موقت") { _, _ ->
                val v = parseNumber(value.text.toString())
                if (v == null || v <= 0.0 || currency.text.isBlank() || unit.text.isBlank() || source.text.isBlank()) {
                    toast("قیمت، ارز، واحد و منبع را کامل وارد کنید.")
                } else {
                    val item = assets[index]
                    item.globalPrice = v
                    item.globalCurrency = currency.text.toString().trim().uppercase(Locale.ROOT)
                    item.globalUnit = unit.text.toString().trim()
                    item.globalSource = source.text.toString().trim() + " (ورود دستی؛ تأییدنشده)"
                    item.globalUpdatedAt = java.text.SimpleDateFormat("yyyy/MM/dd HH:mm", Locale("fa", "IR")).format(java.util.Date())
                    saveAssets(); render()
                }
            }.setNegativeButton("لغو", null).show()
    }

    private fun dialogBox(vararg views: View) = LinearLayout(this).apply {
        orientation = LinearLayout.VERTICAL
        setPadding(32, 12, 32, 8)
        views.forEach { addView(it) }
    }

    private fun addText(parent: LinearLayout, value: String, size: Int, color: Int, bold: Boolean = false) {
        parent.addView(TextView(this).apply {
            text = value
            textSize = size.toFloat()
            val themedColor = when (color) {
                Color.BLACK, Color.DKGRAY -> activeTheme.text
                Color.GRAY -> if (isLightTheme()) Color.rgb(105, 110, 118) else Color.rgb(190, 190, 190)
                else -> color
            }
            setTextColor(themedColor)
            gravity = Gravity.RIGHT
            textDirection = View.TEXT_DIRECTION_RTL
            if (bold) setTypeface(null, android.graphics.Typeface.BOLD)
            setPadding(0, 8, 0, 8)
        })
    }

    private fun card(block: LinearLayout.() -> Unit) {
        val box = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(18, 12, 18, 12)
            setBackgroundColor(activeTheme.surface)
            block()
        }
        val params = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 12, 0, 12) }
        content.addView(box, params)
    }

    private fun button(label: String, action: () -> Unit) = Button(this).apply {
        text = label
        backgroundTintList = android.content.res.ColorStateList.valueOf(activeTheme.accent)
        setTextColor(if (activeTheme.key == "light") Color.WHITE else Color.rgb(24, 24, 24))
        setOnClickListener { action() }
    }

    private fun themeDialog() {
        val selectedKey = activeTheme.key
        val adapter = object : android.widget.BaseAdapter() {
            override fun getCount() = appThemes.size
            override fun getItem(position: Int) = appThemes[position]
            override fun getItemId(position: Int) = position.toLong()
            override fun getView(position: Int, convertView: View?, parent: android.view.ViewGroup?): View {
                val theme = appThemes[position]
                val line = (convertView as? LinearLayout) ?: LinearLayout(this@MainActivity).apply {
                    orientation = LinearLayout.HORIZONTAL
                    gravity = Gravity.CENTER_VERTICAL
                    setPadding(dp(16), dp(10), dp(16), dp(10))
                }
                line.removeAllViews()
                val preview = LinearLayout(this@MainActivity).apply {
                    orientation = LinearLayout.HORIZONTAL
                    background = android.graphics.drawable.GradientDrawable().apply {
                        setColor(theme.surface)
                        cornerRadius = dp(8).toFloat()
                        setStroke(dp(1), theme.accent)
                    }
                    setPadding(dp(7), dp(7), dp(7), dp(7))
                }
                listOf(theme.background, theme.surface, theme.accent).forEach { shade ->
                    val swatch = View(this@MainActivity).apply { setBackgroundColor(shade) }
                    preview.addView(swatch, LinearLayout.LayoutParams(dp(18), dp(25)).apply { marginEnd = dp(4) })
                }
                line.addView(preview)
                val label = TextView(this@MainActivity).apply {
                    text = theme.title + if (theme.key == selectedKey) "  ✓ انتخاب‌شده" else ""
                    textSize = 15f
                    setTextColor(theme.text)
                    setPadding(dp(14), dp(8), dp(8), dp(8))
                    gravity = Gravity.CENTER_VERTICAL or Gravity.RIGHT
                }
                line.addView(label, LinearLayout.LayoutParams(0, -2, 1f))
                line.setBackgroundColor(theme.background)
                return line
            }
        }
        AlertDialog.Builder(this)
            .setTitle("انتخاب دستی رنگ‌بندی")
            .setAdapter(adapter) { dialog, which ->
                prefs.edit().putString("app_theme", appThemes[which].key).apply()
                dialog.dismiss()
                render()
                toast("رنگ‌بندی ذخیره شد.")
            }
            .setNegativeButton("بستن", null)
            .show()
    }

    private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

    private fun toast(message: String) = Toast.makeText(this, message, Toast.LENGTH_LONG).show()
}
