
name: Build Android APK and verify install

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Extract source and detect Gradle
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="hamrah_sarmaye_v0.3.7_source_root_fixed.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP"
            ls -lh *.zip || true
            exit 1
          fi

          mkdir -p source
          unzip -q "$SOURCE_ZIP" -d source

          SETTINGS_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          python3 - "$PROJECT_DIR" <<'PY'
          import os, re, glob, sys

          root = sys.argv[1]
          files = []

          for pattern in ("**/*.gradle", "**/*.gradle.kts", "**/*.toml"):
              files.extend(glob.glob(os.path.join(root, pattern), recursive=True))

          patterns = [
              r'\bagp\s*=\s*["\'](\d+\.\d+(?:\.\d+)?)["\']',
              r'\b(?:androidGradlePlugin|agpVersion)\s*=\s*["\'](\d+\.\d+(?:\.\d+)?)["\']',
              r'com\.android\.(?:application|library)[\s\S]{0,150}?version\s*["\'](\d+\.\d+(?:\.\d+)?)["\']'
          ]

          version = None

          for path in files:
              try:
                  data = open(path, encoding="utf-8").read()
              except Exception:
                  continue

              for pattern in patterns:
                  match = re.search(pattern, data)
                  if match:
                      version = match.group(1)
                      break

              if version:
                  break

          if not version:
              sys.exit("Could not detect Android Gradle Plugin version")

          key = ".".join(version.split(".")[:2])

          versions = {
              "8.0": "8.0",
              "8.1": "8.0",
              "8.2": "8.2",
              "8.3": "8.4",
              "8.4": "8.6",
              "8.5": "8.7",
              "8.6": "8.7",
              "8.7": "8.9",
              "8.8": "8.10.2",
              "8.9": "8.11.1",
              "8.10": "8.11.1",
              "8.11": "8.13",
              "8.12": "8.13",
              "8.13": "8.13"
          }

          gradle = versions.get(key)

          if not gradle:
              sys.exit("No configured Gradle version for AGP " + version)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("gradle_version=" + gradle + "\n")

          print("Detected AGP:", version)
          print("Selected Gradle:", gradle)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}

      - name: Align Kotlin JVM target
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/hamrah-jvm-target.init.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin") &&
                      task.hasProperty("kotlinOptions")) {
                      task.kotlinOptions.jvmTarget = "1.8"
                  }
              }
          }
          EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::App Gradle file not found"
            exit 1
          fi

          echo "Android project structure verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --init-script "$RUNNER_TEMP/hamrah-jvm-target.init.gradle" \
            clean assembleDebug

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file was not generated"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          "$AAPT" dump badging "$APK_PATH" \
            > "$RUNNER_TEMP/apk-badging.txt"

          head -n 10 "$RUNNER_TEMP/apk-badging.txt"

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail

            mkdir -p "$RUNNER_TEMP/hamrah-device-test"
            LOG="$RUNNER_TEMP/hamrah-device-test/logcat.txt"

            trap 'adb logcat -d > "$LOG" 2>&1 || true' EXIT

            adb wait-for-device

            BOOTED=0
            for attempt in $(seq 1 60); do
              BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              [ "$BOOTED" = "1" ] && break
              sleep 2
            done

            if [ "$BOOTED" != "1" ]; then
              echo "::error::Android emulator did not finish booting"
              exit 1
            fi

            adb install -r "$APK_PATH"
            adb shell am force-stop com.hamrahsarmaye.app || true

            START_OUTPUT="$(adb shell am start -W -n com.hamrahsarmaye.app/.MainActivity 2>&1)"
            printf '%s\n' "$START_OUTPUT"

            printf '%s\n' "$START_OUTPUT" | grep -q "Status: ok"

            sleep 12
            adb shell pidof com.hamrahsarmaye.app

            adb logcat -d -s AndroidRuntime:E \
              > "$RUNNER_TEMP/hamrah-device-test/runtime-errors.txt"

            if grep -q "FATAL EXCEPTION" \
              "$RUNNER_TEMP/hamrah-device-test/runtime-errors.txt"; then
              echo "::error::App launch produced a fatal exception"
              cat "$RUNNER_TEMP/hamrah-device-test/runtime-errors.txt"
              exit 1
            fi

            echo "INSTALL_AND_LAUNCH_TEST=PASSED" \
              | tee "$RUNNER_TEMP/hamrah-device-test/result.txt"

      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-sarmaye-apk-and-install-test
          path: |
            source/**/app/build/outputs/apk/debug/*.apk
            source/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/hamrah-device-test/
          if-no-files-found: warn
          retention-days: 14
