    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        selectedCountry = prefs.getString("selected_country", "ایران") ?: "ایران"
        loadAssets()
        showSecurityGate()
    }

    override fun onStop() {
        if (authenticated) {
            authenticated = false
            needsReauthentication = true
        }
        super.onStop()
    }

    override fun onResume() {
        super.onResume()
        if (needsReauthentication && !authenticated) {
            needsReauthentication = false
            showSecurityGate()
        }
    }

    private fun showSecurityGate() {
        if (authDialogShowing || isFinishing) return
        authDialogShowing = true
        val storedHash = prefs.getString("security_pin_hash", null)
        if (storedHash.isNullOrBlank()) showPinSetup() else showPinEntry()
    }

    private fun pinField(hintText: String) = EditText(this).apply {
        hint = hintText
        inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
        transformationMethod = PasswordTransformationMethod.getInstance()
        filters = arrayOf(android.text.InputFilter.LengthFilter(12))
    }

    private fun showPinSetup() {
        val first = pinField("رمز جدید؛ حداقل ۶ رقم")
        val confirm = pinField("تکرار رمز")
        val layout = dialogBox(first, confirm)
        AlertDialog.Builder(this)
            .setTitle("تعریف رمز ورود")
            .setMessage("برای محافظت از اطلاعات مالی، یک رمز ۶ تا ۱۲ رقمی تعریف کنید. این رمز در هر بار ورود لازم است.")
            .setView(layout)
            .setCancelable(false)
            .setPositiveButton("ثبت رمز", null)
            .show().also { dialog ->
                authDialog = dialog
                dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                    val a = first.text.toString()
                    val b = confirm.text.toString()
                    if (a.length !in 6..12 || a.any { !it.isDigit() }) {
                        first.error = "رمز باید ۶ تا ۱۲ رقم باشد"
                    } else if (a != b) {
                        confirm.error = "دو رمز یکسان نیستند"
                    } else {
                        val salt = ByteArray(16).also { SecureRandom().nextBytes(it) }
                        val hash = derivePinHash(a, salt)
                        prefs.edit().putString("security_pin_salt", android.util.Base64.encodeToString(salt, android.util.Base64.NO_WRAP))
                            .putString("security_pin_hash", android.util.Base64.encodeToString(hash, android.util.Base64.NO_WRAP))
                            .putInt("security_failed_attempts", 0).apply()
                        authenticated = true
                        authDialogShowing = false
                        dialog.dismiss()
                        render()
                        toast("رمز ورود با موفقیت تعریف شد.")
                    }
                }
                dialog.setOnDismissListener {
                    if (authDialog === dialog) authDialog = null
                    if (!authenticated) authDialogShowing = false
                }
            }
    }

    private fun showPinEntry() {
        val pin = pinField("رمز ورود")
        val message = "برای ورود به همراه سرمایه رمز خود را وارد کنید. پس از ۵ بار تلاش ناموفق، ورود برای ۳۰ ثانیه محدود می‌شود."
        AlertDialog.Builder(this)
            .setTitle("قفل امنیتی همراه سرمایه")
            .setMessage(message)
            .setView(pin)
            .setCancelable(false)
            .setPositiveButton("ورود", null)
            .show().also { dialog ->
                authDialog = dialog
                val enter = dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                enter.setOnClickListener {
                    val lockUntil = prefs.getLong("security_lock_until_elapsed", 0L)
                    if (lockUntil > SystemClock.elapsedRealtime()) {
                        val seconds = ((lockUntil - SystemClock.elapsedRealtime()) / 1000L + 1L).coerceAtLeast(1L)
                        pin.error = "لطفاً $seconds ثانیه دیگر تلاش کنید"
                        return@setOnClickListener
                    }
                    val salt = android.util.Base64.decode(prefs.getString("security_pin_salt", "") ?: "", android.util.Base64.DEFAULT)
                    val expected = android.util.Base64.decode(prefs.getString("security_pin_hash", "") ?: "", android.util.Base64.DEFAULT)
                    val candidate = derivePinHash(pin.text.toString(), salt)
                    if (pin.text.length in 6..12 && MessageDigest.isEqual(expected, candidate)) {
                        prefs.edit().putInt("security_failed_attempts", 0).putLong("security_lock_until_elapsed", 0L).apply()
                        authenticated = true
                        authDialogShowing = false
                        dialog.dismiss()
                        render()
                    } else {
                        val attempts = prefs.getInt("security_failed_attempts", 0) + 1
                        val editor = prefs.edit().putInt("security_failed_attempts", attempts)
                        if (attempts >= 5) {
                            editor.putLong("security_lock_until_elapsed", SystemClock.elapsedRealtime() + 30_000L)
                            editor.putInt("security_failed_attempts", 0)
                        }
                        editor.apply()
                        pin.text.clear()
                        pin.error = if (attempts >= 5) "۵ بار تلاش ناموفق؛ ورود برای ۳۰ ثانیه محدود شد" else "رمز اشتباه است (${attempts}/5)"
                    }
                }
                dialog.setOnDismissListener {
                    if (authDialog === dialog) authDialog = null
                    if (!authenticated) authDialogShowing = false
                }
            }
    }

    private fun derivePinHash(pin: String, salt: ByteArray): ByteArray {
        val spec = PBEKeySpec(pin.toCharArray(), salt, 120_000, 256)
        return try { SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).encoded }
        finally { spec.clearPassword() }
    }

    private fun parseNumber(value: String): Double? {
        val normalized = value
            .replace('۰', '0').replace('۱', '1').replace('۲', '2').replace('۳', '3')
            .replace('۴', '4').replace('۵', '5').replace('۶', '6').replace('۷', '7')
            .replace('۸', '8').replace('۹', '9')
            .replace('٠', '0').replace('١', '1').replace('٢', '2').replace('٣', '3')
            .replace('٤', '4').replace('٥', '5').replace('٦', '6').replace('٧', '7')
            .replace('٨', '8').replace('٩', '9').replace(",", "").replace("٬", "").trim()
        return normalized.toDoubleOrNull()
    }

    private fun currencyLabel(country: String): String = when (country) {
        "ایران" -> "تومان"
        "آلمان", "فرانسه" -> "یورو"
        "ترکیه" -> "لیر"
        "امارات" -> "درهم"
        "عراق" -> "دینار عراق"
        "افغانستان" -> "افغانی"
        else -> "ارز محلی"
    }
    private fun localCurrencyLabel(): String = currencyLabel(selectedCountry)
    private fun money(value: Double): String = "${nf.format(value.toLong())} ${localCurrencyLabel()}"
    private fun positionMoney(item: AssetItem, value: Double): String = "${nf.format(value.toLong())} ${currencyLabel(item.positionCountry)}"
    // Legacy/manual values are never accepted as current market quotes. This stays zero until a verified provider feed is integrated.
    private fun localPrice(item: AssetItem): Double = 0.0
    private fun fmt(value: Double): String = nf.format(value)

    /** Resolves each asset once in the background; the ordinary user never enters URLs or symbols. */
    private fun ensureGlobalReference(assetType: String, assetName: String) {
        val candidate = GlobalAssetResolver.identify(assetType, assetName) ?: return
        val prefKey = "global_ref_${candidate.key}"
        val stored = GlobalAssetResolver.load(prefs, assetType, assetName)
        val registryConfigured = BuildConfig.GLOBAL_ASSET_REGISTRY_URL.isNotBlank()
        if (stored?.feedReady == true) return
        if (stored != null && !registryConfigured) return
        val lastAttempt = prefs.getLong("${prefKey}_attempted_at", 0L)
        if (prefs.getBoolean("${prefKey}_resolving", false) ||
            (lastAttempt > 0L && System.currentTimeMillis() - lastAttempt < 6 * 60 * 60_000L)) return
        prefs.edit().putBoolean("${prefKey}_resolving", true)
            .putLong("${prefKey}_attempted_at", System.currentTimeMillis()).apply()
        Thread {
            val resolved = GlobalAssetResolver.resolve(assetType, assetName)
            runOnUiThread {
                if (resolved != null) GlobalAssetResolver.save(prefs, resolved)
                prefs.edit().remove("${prefKey}_resolving").apply()
                if (!isFinishing) render()
            }
        }.start()
    }

    private fun saveAssets() {
        val array = JSONArray()
        assets.forEach { item ->
            array.put(JSONObject().apply {
                put("name", item.name)
                put("amount", item.amount)
                put("averageBuyPrice", item.averageBuyPrice)
                put("positionCountry", item.positionCountry)
                put("currentPrice", item.currentPrice)
                put("realizedPnl", item.realizedPnl)
                put("globalPrice", item.globalPrice)
                put("globalCurrency", item.globalCurrency)
                put("globalUnit", item.globalUnit)
                put("internalSource", item.internalSource)
                put("internalCountry", item.internalCountry)
                put("globalSource", item.globalSource)
                put("internalUpdatedAt", item.internalUpdatedAt)
                put("globalUpdatedAt", item.globalUpdatedAt)
                put("usdToLocalRate", item.usdToLocalRate)
                put("usdToLocalCountry", item.usdToLocalCountry)
                put("assetType", item.assetType)
                put("valuationBase", item.valuationBase)
                put("valuationArea", item.valuationArea)
                put("valuationAdjustmentPercent", item.valuationAdjustmentPercent)
                put("valuationDetails", item.valuationDetails)
            })
        }
        val watchJson = JSONArray()
        watchlist.forEach { w -> watchJson.put(JSONObject().put("name", w.name).put("assetType", w.assetType).put("country", w.country)) }
        val tradesJson = JSONArray()
        tradeHistory.forEach { t -> tradesJson.put(JSONObject().put("assetName", t.assetName).put("side", t.side).put("quantity", t.quantity).put("unitPrice", t.unitPrice).put("currency", t.currency).put("timestamp", t.timestamp)) }
        prefs.edit().putString("assets", array.toString()).putString("watchlist", watchJson.toString()).putString("trade_history", tradesJson.toString()).apply()
    }

    private fun loadAssets() {
        assets.clear()
        val raw = prefs.getString("assets", null)
            ?: prefs.getString("pre_update_backup_assets", null)
            ?: "[]"
        if (prefs.getString("assets", null) == null) {
            prefs.edit()
                .putString("assets", raw)
                .putString("selected_country", prefs.getString("pre_update_backup_country", "ایران"))
                .apply()
            selectedCountry = prefs.getString("selected_country", "ایران") ?: "ایران"
        }
        try {
            val array = JSONArray(raw)
            for (i in 0 until array.length()) {
                val obj = array.getJSONObject(i)
                assets.add(AssetItem(
                    name = obj.optString("name", "دارایی"),
                    amount = obj.optDouble("amount", 0.0),
                    averageBuyPrice = obj.optDouble("averageBuyPrice", 0.0),
                    positionCountry = obj.optString("positionCountry", "ایران"),
                    currentPrice = obj.optDouble("currentPrice", 0.0),
                    realizedPnl = obj.optDouble("realizedPnl", 0.0),
                    globalPrice = obj.optDouble("globalPrice", 0.0),
                    globalCurrency = obj.optString("globalCurrency", "USD"),
                    globalUnit = obj.optString("globalUnit", "per troy ounce"),
                    internalSource = obj.optString("internalSource", "ثبت دستی"),
                    internalCountry = obj.optString("internalCountry", "ایران"),
                    globalSource = obj.optString("globalSource", "تنظیم نشده"),
                    internalUpdatedAt = obj.optString("internalUpdatedAt", ""),
                    globalUpdatedAt = obj.optString("globalUpdatedAt", ""),
                    usdToLocalRate = obj.optDouble("usdToLocalRate", 0.0),
                    usdToLocalCountry = obj.optString("usdToLocalCountry", ""),
                    assetType = obj.optString("assetType", "سایر"),
                    valuationBase = obj.optDouble("valuationBase", 0.0),
                    valuationArea = obj.optDouble("valuationArea", 0.0),
                    valuationAdjustmentPercent = obj.optDouble("valuationAdjustmentPercent", 0.0),
                    valuationDetails = obj.optString("valuationDetails", "")
                ))
            }
            watchlist.clear()
            val watchRaw = prefs.getString("watchlist", "[]") ?: "[]"
            val watchArray = JSONArray(watchRaw)
            for (i in 0 until watchArray.length()) {
                val o = watchArray.getJSONObject(i)
                watchlist.add(WatchItem(o.optString("name"), o.optString("assetType", "سایر"), o.optString("country", selectedCountry)))
            }
            tradeHistory.clear()
            val tradeRaw = prefs.getString("trade_history", "[]") ?: "[]"
            val tradeArray = JSONArray(tradeRaw)
            for (i in 0 until tradeArray.length()) {
                val o = tradeArray.getJSONObject(i)
                tradeHistory.add(TradeRecord(o.optString("assetName"), o.optString("side"), o.optDouble("quantity"), o.optDouble("unitPrice"), o.optString("currency"), o.optLong("timestamp")))
            }
        } catch (_: Exception) {
            Toast.makeText(this, "اطلاعات ذخیره‌شده قابل خواندن نبود.", Toast.LENGTH_LONG).show()
        }
    }

    private fun render() {
        val scroll = ScrollView(this)
        content = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(16), dp(20), dp(16), dp(28))
            setBackgroundColor(activeTheme.background)
        }
        scroll.addView(content)

        val brandHeader = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(0, 4, 0, 16)
        }
        val logo = ImageView(this).apply {
            setImageResource(R.drawable.app_logo)
            scaleType = ImageView.ScaleType.FIT_CENTER
            contentDescription = "لوگوی همراه سرمایه"
        }
        brandHeader.addView(logo, LinearLayout.LayoutParams(dp(142), dp(142)))
        val brandTitle = TextView(this).apply {
            text = "همراه سرمایه"
            textSize = 27f
            setTextColor(activeTheme.accent)
            gravity = Gravity.CENTER
            setTypeface(null, android.graphics.Typeface.BOLD)
        }
        brandHeader.addView(brandTitle)
        val slogan = TextView(this).apply {
            text = "سرمایه مردم، امانت ماست؛ اول محافظت، بعد رشد."
            textSize = 13f
            setTextColor(activeTheme.text)
            gravity = Gravity.CENTER
        }
        brandHeader.addView(slogan)
        content.addView(brandHeader)
        addText(content, "کشور بازار داخلی: $selectedCountry", 14, activeTheme.text, true)

        // Dashboard summary cards: only user-entered values are shown; no fabricated live quotes.
        addText(content, "نمای کلی دارایی‌ها", 18, activeTheme.accent, true)
        val overview = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER
        }
        val previewAssets = assets.take(3)
        if (previewAssets.isEmpty()) {
            listOf("طلای ۱۸ عیار", "دلار آزاد", "سکه").forEach { title ->
                overview.addView(marketPreviewCard(title, "برای نمایش، دارایی ثبت کنید"),
                    LinearLayout.LayoutParams(0, dp(92), 1f))
            }
        } else {
            previewAssets.forEach { item ->
                val value = if (item.amount > 0 && item.averageBuyPrice > 0) money(item.amount * item.averageBuyPrice) else "موجودی ثبت نشده"
                overview.addView(marketPreviewCard(item.name, value),
                    LinearLayout.LayoutParams(0, dp(92), 1f))
            }
        }
        content.addView(overview)

        card {
            addText(this, "تحلیل هوشمند بازار", 17, activeTheme.accent, true)
            addText(this, "اتصال قیمت زنده و موتور سیگنال هنوز تأیید نشده است؛ بنابراین این بخش فعلاً وضعیت داده را نشان می‌دهد و توصیه خرید یا فروش صادر نمی‌کند.", 13, activeTheme.text)
            addText(this, "رنگ سیگنال‌ها در نسخه عملیاتی ثابت خواهد بود: سبز فرصت، قرمز ریسک، زرد نامشخص.", 11, activeTheme.text)
        }

        val total = assets.sumOf { item ->
            if (item.assetType == "خانه / ملک" || item.assetType == "خودرو") {
                if (item.positionCountry == selectedCountry) estimatedValue(item) else 0.0
            } else item.amount * localPrice(item)
        }
        val unrealized = assets.sumOf { item ->
            if (item.assetType != "خانه / ملک" && item.assetType != "خودرو" && localPrice(item) > 0)
                item.amount * (localPrice(item) - item.averageBuyPrice) else 0.0
        }
        val realizedByCountry = assets.groupBy { it.positionCountry }.mapValues { (_, items) -> items.sumOf { it.realizedPnl } }
        card {
            addText(this, "ارزش تقریبی دارایی‌های بازار $selectedCountry", 15, Color.DKGRAY)
            addText(this, money(total), 24, Color.rgb(25, 70, 55), true)
            addText(this, "سود/زیان تحقق‌نیافته: ${money(unrealized)}", 14, pnlColor(unrealized))
            realizedByCountry.forEach { (country, value) ->
                addText(this, "سود/زیان تحقق‌یافته در بازار $country: ${nf.format(value.toLong())} ${currencyLabel(country)}", 14, pnlColor(value))
            }
            addText(this, "ارزش سبد فقط با قیمت معتبرِ بازار کشور انتخاب‌شده محاسبه می‌شود.", 12, Color.GRAY)
            addText(this, "قیمت بازار تا اتصال منبع معتبر نمایش داده نمی‌شود؛ مقادیر قدیمی/دستی برای ارزش‌گذاری استفاده نمی‌شوند.", 12, Color.GRAY)
        }

        val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
        actions.addView(button("افزودن دارایی") { addAssetDialog() }, LinearLayout.LayoutParams(0, -2, 1f))
        actions.addView(button("ذخیره اطلاعات") { saveAssets(); toast("اطلاعات ذخیره شد.") }, LinearLayout.LayoutParams(0, -2, 1f))
        content.addView(actions)
        content.addView(button("انتخاب کشور بازار داخلی") { countryDialog() })
        content.addView(button("به‌روزرسانی همراه سرمایه") { checkForAppUpdate() })
        content.addView(button("تنظیمات ظاهر و انتخاب رنگ‌بندی") { themeDialog() })
        addText(content, "دارایی‌های تحت نظر (بدون نیاز به مالکیت)", 19, activeTheme.accent, true)
        addText(content, "این فهرست فقط برای پایش بازار است و به دارایی‌های شخصی اضافه نمی‌شود.", 12, Color.GRAY)
        content.addView(button("افزودن به فهرست تحت نظر") { addWatchItemDialog() })
        if (watchlist.isEmpty()) card { addText(this, "هنوز موردی برای پایش انتخاب نشده است.", 13, Color.GRAY) }
        watchlist.forEachIndexed { wi, w ->
            ensureGlobalReference(w.assetType, w.name)
            card {
                addText(this, w.name, 16, Color.BLACK, true)
                addText(this, "${w.assetType} · بازار ${w.country}", 12, Color.GRAY)
                addText(this, "وضعیت قیمت: هنوز به منبع معتبر متصل نشده؛ سیگنال صادر نمی‌شود.", 12, Color.rgb(150, 110, 20))
                addView(button("حذف از فهرست تحت نظر") { watchlist.removeAt(wi); saveAssets(); render() })
            }
        }
        addText(content, "نسخه برنامه: ${BuildConfig.VERSION_NAME}", 12, Color.GRAY)
        addText(content, "دارایی‌های من (${assets.size} از ۱۰)", 20, activeTheme.accent, true)

        if (assets.isEmpty()) {
            card { addText(this, "هنوز دارایی‌ای ثبت نکرده‌اید. برای شروع، گزینه «افزودن دارایی» را بزنید.", 14, Color.DKGRAY) }
        }

        assets.forEachIndexed { index, item ->
            ensureGlobalReference(item.assetType, item.name)
            card {
                addText(this, item.name, 18, Color.BLACK, true)
                addText(this, "نوع دارایی: ${item.assetType}", 13, Color.DKGRAY)
                if (item.assetType == "خانه / ملک" || item.assetType == "خودرو") {
                    val estimate = estimatedValue(item)
                    if (estimate > 0.0) {
                        addText(this, "ارزش تخمینی: ${positionMoney(item, estimate)}", 16, Color.rgb(25, 70, 55), true)
                        addText(this, "این عدد برآورد بر اساس اطلاعات ثبت‌شده است؛ قیمت قطعی یا قیمت‌گذاری زنده نیست.", 12, Color.GRAY)
                    } else {
                        addText(this, "برای برآورد ارزش، مشخصات و قیمت نمونه مشابه را ثبت کنید.", 12, Color.GRAY)
                    }
                    if (item.valuationDetails.isNotBlank()) addText(this, "مشخصات: ${item.valuationDetails}", 12, Color.GRAY)
                    addView(button("ثبت مشخصات و مبنای ارزش‌گذاری") { valuationDialog(index) })
                } else {
                    addText(this, "موجودی: ${fmt(item.amount)}", 14, Color.DKGRAY)
                }
                if (item.assetType != "خانه / ملک" && item.assetType != "خودرو") {
                    addText(this, "میانگین قیمت خرید: ${positionMoney(item, item.averageBuyPrice)} · بازار ${item.positionCountry}", 14, Color.DKGRAY)
                    addText(this, if (localPrice(item) > 0) "قیمت بازار داخلی: ${money(localPrice(item))}" else if (item.currentPrice > 0) "قیمت ثبت‌شده مربوط به بازار ${item.internalCountry} است؛ برای کشور انتخابی معتبر نیست." else "قیمت بازار داخلی ثبت نشده است.", 14, Color.DKGRAY)
                    addText(this, "منبع داخلی (داده ذخیره‌شده قدیمی/دستی؛ غیرزنده): ${item.internalSource} · کشور منبع: ${item.internalCountry}${if (item.internalUpdatedAt.isNotBlank()) " · ${item.internalUpdatedAt}" else ""}", 12, Color.GRAY)
                    addText(this, if (item.globalPrice > 0) "قیمت مرجع جهانی: ${nf.format(item.globalPrice)} ${item.globalCurrency} ${item.globalUnit}" else "قیمت مرجع جهانی: هنوز پیکربندی نشده", 14, Color.DKGRAY)
                    addText(this, "منبع جهانی (نیازمند اتصال معتبر): ${item.globalSource}${if (item.globalUpdatedAt.isNotBlank()) " · ${item.globalUpdatedAt}" else ""}", 12, Color.GRAY)
                    val globalRef = GlobalAssetResolver.load(prefs, item.assetType, item.name)
                    if (globalRef != null) {
                        addText(this, "شناسه مرجع جهانی: ${globalRef.benchmarkId} · ${globalRef.displayName}", 12, Color.DKGRAY)
                        addText(this, "وضعیت شناسایی خودکار: ${globalRef.status}", 12, if (globalRef.feedReady) Color.rgb(25, 130, 80) else Color.rgb(150, 110, 20))
                        if (globalRef.feedReady) addText(this, "تأمین‌کننده: ${globalRef.providerName} · واحد مرجع: ${globalRef.unit}", 12, Color.GRAY)
                    } else {
                        addText(this, "مرجع جهانی تخصصی برای این دارایی هنوز در کاتالوگ شناسایی نشده است؛ هیچ نماد حدسی استفاده نمی‌شود.", 12, Color.GRAY)
                    }
                    val validLocalPrice = localPrice(item)
                    if (validLocalPrice > 0) {
                        val unrealizedPnl = item.amount * (validLocalPrice - item.averageBuyPrice)
                        addText(this, "سود/زیان تحقق‌نیافته: ${money(unrealizedPnl)}", 14, pnlColor(unrealizedPnl))
                    } else {
                        addText(this, "سود/زیان تحقق‌نیافته: تا دریافت قیمت معتبر محاسبه نمی‌شود.", 14, Color.GRAY)
                    }
                    addText(this, "سود/زیان تحقق‌یافته: ${positionMoney(item, item.realizedPnl)}", 14, pnlColor(item.realizedPnl))
                    val itemTrades = tradeHistory.filter { it.assetName == item.name }
                    addText(this, "سوابق ثبت‌شده خرید/فروش: ${itemTrades.size} معامله", 12, Color.GRAY)
                    itemTrades.takeLast(3).asReversed().forEach { tr ->
                        val sideLabel = if (tr.side == "BUY") "خرید" else "فروش"
                        addText(this, "$sideLabel · مقدار ${fmt(tr.quantity)} · قیمت واحد ${nf.format(tr.unitPrice)} ${tr.currency}", 12, Color.DKGRAY)
                    }
                    val row = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL }
                    row.addView(button("خرید") { tradeDialog(index, true) }, LinearLayout.LayoutParams(0, -2, 1f))
                    row.addView(button("فروش") { tradeDialog(index, false) }, LinearLayout.LayoutParams(0, -2, 1f))
                    addView(row)
                    if (isGoldAsset(item)) {
                        val theoreticalGold18 = theoreticalGold18Price(item)
                        if (theoreticalGold18 != null) {
                            addText(this, "قیمت نظری مبنا برای هر گرم طلای ۱۸ عیار: ${positionMoney(item, theoreticalGold18)}", 14, Color.rgb(25, 70, 55), true)
                            addText(this, "فرمول: قیمت اونس دلاری × نرخ دلار بازار ${item.usdToLocalCountry} ÷ ۴۱٫۴۷۱۳", 12, Color.GRAY)
                            val domestic = localPrice(item)
                            if (isGold18GramAsset(item) && domestic > 0.0 && theoreticalGold18 > 0.0) {
                                val bubble = ((domestic - theoreticalGold18) / theoreticalGold18) * 100.0
                                val bubbleColor = when { bubble > 0.5 -> Color.rgb(190, 70, 45); bubble < -0.5 -> Color.rgb(25, 130, 80); else -> Color.DKGRAY }
                                val bubbleText = (if (bubble > 0) "+" else "") + String.format(Locale.US, "%.2f", bubble) + "٪"
                                addText(this, "حباب خام بازار داخلی نسبت به ارزش نظری: $bubbleText", 15, bubbleColor, true)
                                addText(this, if (bubble < -0.5) "قیمت داخلی پایین‌تر از مبنای نظری است؛ این اختلاف به‌تنهایی توصیه خرید نیست." else if (bubble > 0.5) "قیمت داخلی بالاتر از مبنای نظری است؛ این اختلاف به‌تنهایی توصیه فروش نیست." else "قیمت داخلی نزدیک مبنای نظری محاسبه‌شده است.", 12, Color.GRAY)
                                addText(this, "حباب خام است و هزینه‌ها، اختلاف خریدوفروش و نقدشوندگی در آن تعدیل نشده‌اند.", 12, Color.GRAY)
                            } else if (!isGold18GramAsset(item)) {
                                addText(this, "برای محاسبه حباب، نام دارایی باید مشخص کند قیمت ثبت‌شده مربوط به هر گرم طلای ۱۸ عیار است.", 12, Color.GRAY)
                            } else {
                                addText(this, "برای محاسبه حباب، قیمت داخلی هر گرم طلای ۱۸ عیار را ثبت کنید.", 12, Color.GRAY)
                            }
                        } else {
                            addText(this, "برای محاسبه قیمت نظری، مرجع جهانی باید قیمت هر اونس تروا به USD باشد و نرخ دلار بازار کشور انتخابی ثبت شود.", 12, Color.GRAY)
                        }
                        addView(button("ثبت نرخ دلار بازار داخلی برای محاسبه طلا") { goldFxDialog(index) })
                    }
                } else {
                    addText(this, "مبنای مقایسه: قیمت نمونه مشابه واردشده توسط کاربر", 12, Color.GRAY)
                    addText(this, "بازار ارزش‌گذاری: ${item.positionCountry}", 12, Color.GRAY)
                }
            }
        }
        addText(content, "توجه: فقط مظنه‌ای که از endpoint تأییدشده و دارای timestamp معتبر دریافت شود، می‌تواند قیمت مرجع زنده تلقی شود؛ این نسخه هنوز سیگنال مالی صادر نمی‌کند.", 12, activeTheme.text)

        val bottomNav = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER
            setPadding(dp(4), dp(5), dp(4), dp(5))
            setBackgroundColor(if (isLightTheme()) Color.rgb(235, 237, 240) else Color.rgb(8, 8, 9))
        }
        val navItems = listOf("⌂\\nخانه", "▥\\nتحلیل", "▣\\nدارایی‌ها", "⇄\\nتبدیل ارز", "⚙\\nتنظیمات")
        navItems.forEachIndexed { index, label ->
            val nav = TextView(this).apply {
                text = label
                gravity = Gravity.CENTER
                textSize = 10f
                setTypeface(null, android.graphics.Typeface.BOLD)
