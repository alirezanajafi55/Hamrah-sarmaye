    private val nf = NumberFormat.getNumberInstance(Locale("fa", "IR"))
    private val supportedCountries = arrayOf("ایران", "آلمان", "فرانسه", "ترکیه", "امارات", "عراق", "افغانستان", "کشور دیگر")
    private var selectedCountry = "ایران"
    private var authenticated = false
    private var needsReauthentication = false
    private var authDialogShowing = false
    private var authDialog: AlertDialog? = null
    private var globalFeedScheduler: MarketRefreshScheduler? = null
    private var globalFeedSignature: String = ""
    private data class AppTheme(val key: String, val title: String, val background: Int, val surface: Int, val text: Int, val accent: Int)
    private val appThemes = listOf(
        AppTheme("gold", "مشکی و طلایی کلاسیک", Color.rgb(20, 20, 22), Color.rgb(38, 36, 32), Color.WHITE, Color.rgb(218, 174, 75)),
        AppTheme("light", "روشن و نقره‌ای", Color.rgb(247, 248, 250), Color.WHITE, Color.rgb(35, 39, 45), Color.rgb(105, 115, 128)),
        AppTheme("navy", "سرمه‌ای و طلایی", Color.rgb(15, 39, 59), Color.rgb(27, 57, 80), Color.WHITE, Color.rgb(225, 190, 105)),
        AppTheme("green", "سبز تیره و کرم", Color.rgb(22, 55, 46), Color.rgb(35, 72, 61), Color.WHITE, Color.rgb(226, 211, 170)),
        AppTheme("amoled", "مشکی AMOLED", Color.BLACK, Color.rgb(16, 16, 16), Color.WHITE, Color.rgb(235, 190, 75))
    )
    private fun isLightTheme(theme: AppTheme = activeTheme) = theme.key == "light"
