data class AssetItem(
    val name: String,
    var amount: Double = 0.0,
    var averageBuyPrice: Double = 0.0,
    var positionCountry: String = "ایران",
    // currentPrice remains the local-market quote for backward compatibility.
    var currentPrice: Double = 0.0,
    var realizedPnl: Double = 0.0,
    var globalPrice: Double = 0.0,
    var globalCurrency: String = "USD",
    var globalUnit: String = "per troy ounce",
    var internalSource: String = "ثبت دستی",
    var internalCountry: String = "ایران",
    var globalSource: String = "تنظیم نشده",
    var internalUpdatedAt: String = "",
    var globalUpdatedAt: String = "",
    // Domestic-currency units per 1 USD, used for theoretical gold conversion.
    var usdToLocalRate: Double = 0.0,
    var usdToLocalCountry: String = "",
    var assetType: String = "سایر",
    var valuationBase: Double = 0.0,
    var valuationArea: Double = 0.0,
    var valuationAdjustmentPercent: Double = 0.0,
    var valuationDetails: String = ""
)


data class TradeRecord(
    val assetName: String,
    val side: String,
    val quantity: Double,
    val unitPrice: Double,
    val currency: String,
    val timestamp: Long = System.currentTimeMillis()
)

data class WatchItem(val name: String, val assetType: String, val country: String)

